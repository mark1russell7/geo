# The bench of the buffers (R16 of docs/ROADMAP.md): bufferKm of packages/geo against bufferKm of geo 0.4.4.
# The job is in bench-suite.yml, with the suite buffer. At this time, its report only reads the claims of packages/bench/src/suites.ts.
# The job fails when the result of the head is not the same as the result of geo 0.4.4 on a case, or has no read.
# The result is the class of seeded samples out of the band of the tolerance. A sample on the wrong side stops the arm.
# Start it on a branch with: gh workflow run bench-buffer.yml -R mark1russell7/geo --ref <branch>
# The input copies starts more benches of the same commit on other runners, for the limit of a gate:
# gh workflow run bench-buffer.yml -R mark1russell7/geo --ref <branch> -f copies='[1,2,3,4,5]'
name: Bench buffer

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - packages/geo/src/buffer.ts
      - packages/geo/src/distance.ts
      - packages/geo/src/simplify.ts
      - packages/geo/src/locator.ts
      - packages/geo/src/planar.ts
      - packages/geo/src/polygon.ts
      - packages/geo/src/geojson.ts
      - packages/geo/src/point.ts
      - packages/geo/src/sphere.ts
      - packages/bench/**
      - .github/workflows/bench-buffer.yml
      - .github/workflows/bench-suite.yml
  workflow_dispatch:
    inputs:
      rounds:
        description: The rounds of each case and pair. The bench adds rounds of the budget case when a look has no outcome.
        default: "7"
      cases:
        description: The names of the cases, with commas. Empty means each case.
        default: ""
      copies:
        description: A JSON list of copy numbers. Each copy is one bench on its own runner (5 copies give the limit of a gate).
        default: "[1]"

permissions:
  contents: read

# A newer push cancels the run of a pull request. Each commit of main has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@a6fe0b4de26f6f9fcc3bc7765dd2bcf141f6da3d # main
        with:
          paths: |
            packages/geo/src/buffer.ts
            packages/geo/src/distance.ts
            packages/geo/src/simplify.ts
            packages/geo/src/locator.ts
            packages/geo/src/planar.ts
            packages/geo/src/polygon.ts
            packages/geo/src/geojson.ts
            packages/geo/src/point.ts
            packages/geo/src/sphere.ts
            packages/bench/**
            pnpm-lock.yaml
            .github/workflows/bench-buffer.yml
            .github/workflows/bench-suite.yml

  bench:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/bench-suite.yml
    with:
      suite: buffer
      rounds: ${{ inputs.rounds || '7' }}
      cases: ${{ inputs.cases || '' }}
      copies: ${{ inputs.copies || '[1]' }}
      profile-case: coast-1e3-t0.3
      timeout-minutes: 90

  bench-ok:
    name: Bench buffer OK
    if: ${{ !cancelled() }}
    needs: [changes, bench]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@a6fe0b4de26f6f9fcc3bc7765dd2bcf141f6da3d # main
        with:
          needs: ${{ toJSON(needs) }}
